<h1>📋 Change log</h1><p class="sub">ประวัติการปรับปรุงเว็บรายงาน (ใหม่สุดอยู่บน)</p>

<script>
const M=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
// "2026-10-29 21:30" → "29 ต.ค. 69 เวลา 21.30 น."
function thDate(s){const m=/^(\d{4})-(\d\d)-(\d\d)(?: (\d\d):(\d\d))?/.exec(s||"");if(!m)return s||"";
  return (+m[3])+" "+M[m[2]-1]+" "+String(+m[1]+543).slice(-2)+(m[4]?" เวลา "+m[4]+"."+m[5]+" น.":"")}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("list").innerHTML=CHANGELOG.map((e,i)=>'<section class="ent" id="v'+esc(e.v)+'"><div class="hd"><span class="v">v'+esc(e.v)+'</span>'
  +(i===0?'<span class="new">ล่าสุด</span>':'')+'<span class="dt">'+esc(thDate(e.date))+'</span></div><ul>'+e.items.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></section>').join("");
</script>
